<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login — Dashboard K-Means Bank Mandiri</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1A1A1A">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" href="/static/app.png" type="image/png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --nb-yellow: #FFE44D;
      --nb-black:  #1A1A1A;
      --nb-white:  #FFFFFF;
      --nb-bg:     #FFFBF0;
      --nb-blue:   #2563EB;
      --nb-red:    #EF4444;
      --nb-green:  #22C55E;
      --nb-border: 3px solid #1A1A1A;
      --nb-shadow: 5px 5px 0px #1A1A1A;
      --font:      'Space Grotesk', 'Segoe UI', Arial, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--nb-bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      /* NeoBrutalism grid pattern */
      background-image:
        linear-gradient(rgba(26,26,26,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(26,26,26,0.06) 1px, transparent 1px);
      background-size: 36px 36px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 440px;
      position: relative;
    }

    /* ── Decorative accent block ── */
    .accent-block {
      position: absolute;
      top: -12px; right: -12px;
      width: 100%; height: 100%;
      background: var(--nb-yellow);
      border: var(--nb-border);
      border-radius: 14px;
      z-index: 0;
    }

    .login-card {
      position: relative;
      z-index: 1;
      background: var(--nb-white);
      border: var(--nb-border);
      border-radius: 14px;
      padding: 40px 36px;
    }

    /* ── Brand ── */
    .brand-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }
    .brand-icon {
      width: 52px; height: 52px;
      background: var(--nb-yellow);
      border: var(--nb-border);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      color: var(--nb-black);
      box-shadow: var(--nb-shadow);
      flex-shrink: 0;
    }
    .brand-text h1 {
      font-size: 20px; font-weight: 700;
      color: var(--nb-black);
      margin: 0 0 2px;
    }
    .brand-text p {
      font-size: 13px;
      color: #4B5563;
      margin: 0;
    }

    /* ── Divider ── */
    .nb-divider {
      height: 3px;
      background: var(--nb-black);
      border-radius: 2px;
      margin-bottom: 28px;
    }

    /* ── Error ── */
    .nb-error {
      background: var(--nb-red);
      border: var(--nb-border);
      border-radius: 10px;
      color: var(--nb-white);
      padding: 11px 15px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--nb-shadow);
    }

    /* ── Form ── */
    .form-label {
      font-weight: 700; font-size: 13px;
      color: var(--nb-black);
      display: block; margin-bottom: 6px;
    }
    .nb-input {
      width: 100%;
      padding: 12px 14px;
      border: var(--nb-border);
      border-radius: 10px;
      font-family: var(--font);
      font-size: 15px;
      color: var(--nb-black);
      background: var(--nb-bg);
      box-shadow: 3px 3px 0 var(--nb-black);
      transition: box-shadow 0.15s, border-color 0.15s;
      outline: none;
    }
    .nb-input::placeholder { color: #9CA3AF; }
    .nb-input:focus {
      border-color: var(--nb-blue);
      box-shadow: 3px 3px 0 var(--nb-blue);
    }

    /* ── Submit button ── */
    .btn-login {
      width: 100%;
      padding: 13px;
      background: var(--nb-black);
      border: var(--nb-border);
      border-radius: 10px;
      color: var(--nb-yellow);
      font-family: var(--font);
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      box-shadow: var(--nb-shadow);
      transition: transform 0.1s, box-shadow 0.1s;
      letter-spacing: 0.3px;
      margin-top: 4px;
    }
    .btn-login:hover {
      transform: translate(-2px,-2px);
      box-shadow: 7px 7px 0 var(--nb-yellow);
    }
    .btn-login:active {
      transform: translate(2px,2px);
      box-shadow: 1px 1px 0 var(--nb-black);
    }

    /* ── Footer note ── */
    .login-footer {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 2px solid #E5E7EB;
      text-align: center;
      color: #6B7280;
      font-size: 12px;
      line-height: 1.7;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .login-card { padding: 28px 20px; }
      .accent-block { display: none; }
      .brand-row { margin-bottom: 20px; }
    }

    /* ── Password toggle wrapper ── */
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .password-wrapper .nb-input {
      padding-right: 48px; /* room for the eye button */
    }
    .pw-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--nb-yellow);
      border: 2px solid var(--nb-black);
      border-radius: 7px;
      width: 32px; height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--nb-black);
      font-size: 14px;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s, box-shadow 0.1s;
      box-shadow: 2px 2px 0 var(--nb-black);
    }
    .pw-toggle:hover {
      background: #FFE44D;
      transform: translateY(-50%) translate(-1px, -1px);
      box-shadow: 3px 3px 0 var(--nb-black);
    }
    .pw-toggle:active {
      transform: translateY(-50%) translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--nb-black);
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="accent-block"></div>

    <div class="login-card">
      <!-- Brand -->
      <div class="brand-row">
        <div class="brand-icon">
          <i class="fa-solid fa-chart-pie"></i>
        </div>
        <div class="brand-text">
          <h1>K-Means Dashboard</h1>
          <p>Analitik Komentar Bank Mandiri</p>
        </div>
      </div>
      <div class="nb-divider"></div>

      <!-- Error -->
      {% if error %}
      <div class="nb-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        {{ error }}
      </div>
      {% endif %}

      <!-- Form -->
      <form method="POST" action="{{ url_for('login') }}" novalidate>
        <div class="mb-4">
          <label for="login-username" class="form-label">
            <i class="fa-solid fa-user me-1"></i> Username
          </label>
          <input type="text" id="login-username" name="username"
                 class="nb-input" placeholder="Masukkan username"
                 autocomplete="username" required autofocus>
        </div>
        <div class="mb-4">
          <label for="login-password" class="form-label">
            <i class="fa-solid fa-lock me-1"></i> Password
          </label>
          <div class="password-wrapper">
            <input type="password" id="login-password" name="password"
                   class="nb-input" placeholder="Masukkan password"
                   autocomplete="current-password" required>
            <button type="button" class="pw-toggle" id="pw-toggle-btn"
                    aria-label="Tampilkan / sembunyikan password"
                    title="Tampilkan password">
              <i class="fa-solid fa-eye" id="pw-toggle-icon"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-login">
          <i class="fa-solid fa-right-to-bracket me-2"></i>Masuk ke Dashboard
        </button>
      </form>

      <!-- Footer -->
      <div class="login-footer">
        Pengelompokan Opini Publik Official TikTok Bank Mandiri<br>
        Metode TF-IDF &bull; LSA/SVD &bull; K-Means Clustering &mdash; Tugas Akhir
      </div>
    </div>
  </div>

  <script>
    (function () {
      var btn  = document.getElementById('pw-toggle-btn');
      var icon = document.getElementById('pw-toggle-icon');
      var inp  = document.getElementById('login-password');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var isHidden = inp.type === 'password';
        inp.type = isHidden ? 'text' : 'password';
        icon.className = isHidden ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        btn.title = isHidden ? 'Sembunyikan password' : 'Tampilkan password';
        inp.focus();
      });
    }());
  </script>
</body>
</html>
